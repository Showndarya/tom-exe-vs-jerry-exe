services:
  isaac-sim:
    volumes:
      - /home/ubuntu/tom-exe-vs-jerry-exe:/workspace:rw
    command:
      - /workspace/output/tom_jerry_stage2.usda

  web-viewer:
    build:
      context: /home/ubuntu/tom-exe-vs-jerry-exe/infra
      dockerfile: Dockerfile.web-viewer.secure
      args:
        ISAACSIM_HOST: ${ISAACSIM_HOST:?set the Brev VM public IP}
        ISAACSIM_SIGNAL_HOST: ${ISAACSIM_SIGNAL_HOST:?set the authenticated signaling hostname}
        ISAACSIM_SIGNAL_PORT: ${ISAACSIM_SIGNAL_PORT:-443}
        ISAACSIM_STREAM_PORT: ${ISAACSIM_STREAM_PORT:-47998}
        ISAACSIM_FORCE_WSS: ${ISAACSIM_FORCE_WSS:-true}
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${WEB_VIEWER_ALLOWED_HOST:-}
